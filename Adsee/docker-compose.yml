services:
  db:
    image: postgis/postgis:14-3.3
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-adsee_db}
      POSTGRES_USER: ${POSTGRES_USER:-adsee_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-8E_S1@.?7Pm-aVzjBztW}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U adsee_user -d adsee_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data

  web:
    build: .
    command: gunicorn Adsee.wsgi:application --bind 0.0.0.0:8001 --workers 4 --timeout 120
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - DJANGO_SETTINGS_MODULE=Adsee.settings
      - POSTGRES_DB=${POSTGRES_DB:-adsee_db}
      - POSTGRES_USER=${POSTGRES_USER:-adsee_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-8E_S1@.?7Pm-aVzjBztW}
      - DB_HOST=db
      - DB_PORT=5433
      - CELERY_BROKER_URL=redis://redis:6379/0
      - ANALYTICS_SERVICE_URL=${ANALYTICS_SERVICE_URL:-http://host.docker.internal:8000/v1}
      - ANALYTICS_API_KEY=${ANALYTICS_API_KEY:-YOs2hZicEJvcW3V3llCC22OYNfOm1-DdaLimF79c-RE}
      - SECRET_KEY=${SECRET_KEY:-wvvsna2jpe^ptl2^cdh&2+6%s2mmmj%c8tma%3^cc7#e-+9wis}
    depends_on:
      - db
      - redis
    restart: unless-stopped

  celery_worker:
    build: .
    command: celery -A Adsee worker -l info --pool=solo
    volumes:
      - .:/app
    environment:
      - DJANGO_SETTINGS_MODULE=Adsee.settings
      - POSTGRES_DB=${POSTGRES_DB:-adsee_db}
      - POSTGRES_USER=${POSTGRES_USER:-adsee_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-8E_S1@.?7Pm-aVzjBztW}
      - DB_HOST=db
      - DB_PORT=5433
      - CELERY_BROKER_URL=redis://redis:6379/0
      - ANALYTICS_SERVICE_URL=${ANALYTICS_SERVICE_URL:-http://host.docker.internal:8000/v1}
      - ANALYTICS_API_KEY=${ANALYTICS_API_KEY:-YOs2hZicEJvcW3V3llCC22OYNfOm1-DdaLimF79c-RE}
      - SECRET_KEY=${SECRET_KEY:-wvvsna2jpe^ptl2^cdh&2+6%s2mmmj%c8tma%3^cc7#e-+9wis}
    depends_on:
      - db
      - redis
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume: